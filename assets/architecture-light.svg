<svg xmlns="http://www.w3.org/2000/svg" width="920" height="660" viewBox="0 0 920 660" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="920" height="660" fill="#f8fafc"/>
  <rect width="920" height="660" fill="url(#grid)"/>

  <!-- ============ arrows (behind boxes) ============ -->
  <!-- Hermes gateway -> hooks -->
  <line x1="230" y1="150" x2="330" y2="150" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arr-cyan)"/>
  <!-- hooks -> controller -->
  <line x1="470" y1="190" x2="470" y2="240" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arr-cyan)"/>
  <!-- controller -> streaming runtime -->
  <line x1="470" y1="320" x2="470" y2="370" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arr-cyan)"/>
  <!-- runtime -> builder -->
  <line x1="600" y1="430" x2="680" y2="430" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arr-cyan)"/>
  <!-- builder -> feishu api -->
  <line x1="800" y1="480" x2="800" y2="530" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <!-- feishu api -> user card -->
  <line x1="800" y1="600" x2="800" y2="618" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <!-- cron scheduler -> cron patcher path -->
  <line x1="120" y1="480" x2="120" y2="530" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <!-- cron card -> feishu api -->
  <line x1="180" y1="500" x2="700" y2="565" stroke="#ea580c" stroke-width="1.2" marker-end="url(#arr-orange)"/>
  <!-- fallback dashed: streaming -> gateway default reply -->
  <path d="M 340 400 C 260 420, 200 300, 180 200" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr-cyan)"/>

  <!-- ============ title ============ -->
  <text x="460" y="38" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="bold">hermes-fry-cards 架构</text>
  <text x="460" y="56" text-anchor="middle" font-size="8.5" fill="#94a3b8">AST hook 注入 · CardKit v2.0 流式卡片</text>

  <!-- ============ Hermes Gateway box (external) ============ -->
  <rect x="40" y="105" width="190" height="90" rx="6" fill="#ffffff"/>
  <rect x="40" y="105" width="190" height="90" rx="6" fill="rgba(100,116,139,0.12)" stroke="#64748b" stroke-width="1.5"/>
  <text x="135" y="130" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold">Hermes Gateway</text>
  <text x="135" y="148" text-anchor="middle" font-size="9" fill="#64748b">gateway/run.py</text>
  <text x="135" y="164" text-anchor="middle" font-size="9" fill="#64748b">cron/scheduler.py</text>
  <text x="135" y="182" text-anchor="middle" font-size="7.5" fill="#94a3b8">消息事件 / 流式 delta 回调</text>

  <!-- ============ AST hooks layer (security boundary style) ============ -->
  <rect x="310" y="88" width="320" height="122" rx="10" fill="none" stroke="#e11d48" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="325" y="104" font-size="8" fill="#e11d48">HOOK INJECTION（patcher.py AST 注入）</text>
  <rect x="326" y="112" width="138" height="42" rx="6" fill="#ffffff"/>
  <rect x="326" y="112" width="138" height="42" rx="6" fill="rgba(190,18,60,0.08)" stroke="#e11d48" stroke-width="1.5"/>
  <text x="395" y="129" text-anchor="middle" font-size="9.5" fill="#9f1239" font-weight="bold">patch.py</text>
  <text x="395" y="144" text-anchor="middle" font-size="8" fill="#be123c">normalize / followup 边界</text>
  <rect x="476" y="112" width="140" height="42" rx="6" fill="#ffffff"/>
  <rect x="476" y="112" width="140" height="42" rx="6" fill="rgba(190,18,60,0.08)" stroke="#e11d48" stroke-width="1.5"/>
  <text x="546" y="129" text-anchor="middle" font-size="9.5" fill="#9f1239" font-weight="bold">14 个生命周期 hook</text>
  <text x="546" y="144" text-anchor="middle" font-size="8" fill="#be123c">start/tool/answer/reasoning…</text>
  <rect x="326" y="162" width="290" height="36" rx="6" fill="#ffffff"/>
  <rect x="326" y="162" width="290" height="36" rx="6" fill="rgba(190,18,60,0.05)" stroke="#e11d48" stroke-width="1"/>
  <text x="471" y="177" text-anchor="middle" font-size="8.5" fill="#9f1239">on_message_completed_wait（async 收尾）</text>
  <text x="471" y="190" text-anchor="middle" font-size="7.5" fill="#be123c">on_interrupted · on_aborted · on_background_deliver</text>

  <!-- ============ Controller (backend green) ============ -->
  <rect x="360" y="240" width="220" height="80" rx="6" fill="#ffffff"/>
  <rect x="360" y="240" width="220" height="80" rx="6" fill="rgba(5,150,105,0.08)" stroke="#059669" stroke-width="1.5"/>
  <text x="470" y="262" text-anchor="middle" font-size="12" fill="#065f46" font-weight="bold">StreamCardController</text>
  <text x="470" y="279" text-anchor="middle" font-size="8.5" fill="#047857">controller.py — 单例主控</text>
  <text x="470" y="295" text-anchor="middle" font-size="8" fill="#059669">CardSession 状态机 IDLE→STREAMING→终态</text>
  <text x="470" y="309" text-anchor="middle" font-size="8" fill="#059669">session_keys 映射 · interrupt 重定向 · /stop</text>

  <!-- ============ Streaming runtime (backend green) ============ -->
  <rect x="250" y="370" width="350" height="110" rx="6" fill="#ffffff"/>
  <rect x="250" y="370" width="350" height="110" rx="6" fill="rgba(5,150,105,0.08)" stroke="#059669" stroke-width="1.5"/>
  <text x="425" y="390" text-anchor="middle" font-size="11" fill="#065f46" font-weight="bold">streaming/ 运行时</text>
  <text x="270" y="408" font-size="8" fill="#047857">controller.py   建卡 / flush / 拆卡 / cron 编排</text>
  <text x="270" y="423" font-size="8" fill="#047857">segments.py     扁平 segment 列表（思考/工具/回答）</text>
  <text x="270" y="438" font-size="8" fill="#047857">flush.py        FlushController 100ms 节流</text>
  <text x="270" y="453" font-size="8" fill="#047857">tooluse.py      工具调用生命周期 + 图标状态</text>
  <text x="270" y="468" font-size="8" fill="#047857">image.py        markdown 图片 → 飞书 img_key</text>
  <text x="270" y="483" font-size="8" fill="#047857">unavailable_guard.py  撤回自动终止</text>

  <!-- ============ CardKit builder (frontend cyan) ============ -->
  <rect x="680" y="380" width="200" height="100" rx="6" fill="#ffffff"/>
  <rect x="680" y="380" width="200" height="100" rx="6" fill="rgba(8,145,178,0.08)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="780" y="402" text-anchor="middle" font-size="11" fill="#155e75" font-weight="bold">cardkit/ 卡片模板</text>
  <text x="695" y="421" font-size="8" fill="#0e7490">builder.py    流式/完成/cron 卡片 JSON</text>
  <text x="695" y="437" font-size="8" fill="#0e7490">markdown.py   CardKit 规范化/表格</text>
  <text x="695" y="453" font-size="8" fill="#0e7490">i18n.py       中英双语标签</text>
  <text x="695" y="469" font-size="7.5" fill="#0891b2">schema 2.0 · collapsible_panel</text>

  <!-- ============ Cron path (orange) ============ -->
  <rect x="50" y="440" width="130" height="60" rx="6" fill="#ffffff"/>
  <rect x="50" y="440" width="130" height="60" rx="6" fill="rgba(234,88,12,0.08)" stroke="#ea580c" stroke-width="1.5"/>
  <text x="115" y="462" text-anchor="middle" font-size="9.5" fill="#9a3412" font-weight="bold">CronPatcher</text>
  <text x="115" y="477" text-anchor="middle" font-size="8" fill="#c2410c">拦截 _deliver_result</text>
  <text x="115" y="491" text-anchor="middle" font-size="8" fill="#c2410c">build_cron_card</text>

  <!-- ============ Feishu API (cloud amber) ============ -->
  <rect x="680" y="530" width="240" height="70" rx="6" fill="#ffffff"/>
  <rect x="680" y="530" width="240" height="70" rx="6" fill="rgba(217,119,6,0.10)" stroke="#d97706" stroke-width="1.5"/>
  <text x="800" y="553" text-anchor="middle" font-size="11" fill="#92400e" font-weight="bold">飞书开放平台</text>
  <text x="800" y="571" text-anchor="middle" font-size="8.5" fill="#b45309">CardKit v2.0 streaming API（lark-oapi）</text>
  <text x="800" y="586" text-anchor="middle" font-size="8" fill="#d97706">单元素增量 update · 创建失败回落网关默认回复</text>

  <!-- ============ user card (small mock, external) ============ -->
  <rect x="720" y="618" width="160" height="30" rx="6" fill="rgba(100,116,139,0.12)" stroke="#64748b" stroke-width="1"/>
  <text x="800" y="637" text-anchor="middle" font-size="9" fill="#334155">💬 用户端流式卡片（打字机）</text>

  <!-- ============ fallback label ============ -->
  <text x="196" y="292" font-size="7.5" fill="#64748b" transform="rotate(-72 196 292)">CardKit 失败 → 网关默认回复</text>

  <!-- ============ legend (outside boundaries) ============ -->
  <rect x="40" y="560" width="520" height="76" rx="6" fill="rgba(100,116,139,0.10)" stroke="#334155" stroke-width="1"/>
  <text x="56" y="580" font-size="9" fill="#64748b" font-weight="bold">图例</text>
  <rect x="56" y="592" width="14" height="10" rx="2" fill="rgba(190,18,60,0.08)" stroke="#e11d48" stroke-width="1"/>
  <text x="76" y="601" font-size="8" fill="#64748b">hook 注入层</text>
  <rect x="176" y="592" width="14" height="10" rx="2" fill="rgba(5,150,105,0.08)" stroke="#059669" stroke-width="1"/>
  <text x="196" y="601" font-size="8" fill="#64748b">插件核心运行时</text>
  <rect x="316" y="592" width="14" height="10" rx="2" fill="rgba(8,145,178,0.08)" stroke="#0891b2" stroke-width="1"/>
  <text x="336" y="601" font-size="8" fill="#64748b">卡片构建</text>
  <rect x="426" y="592" width="14" height="10" rx="2" fill="rgba(217,119,6,0.10)" stroke="#d97706" stroke-width="1"/>
  <text x="446" y="601" font-size="8" fill="#64748b">外部服务</text>
  <line x1="56" y1="618" x2="84" y2="618" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="92" y="621" font-size="8" fill="#64748b">cron 推送路径</text>
  <line x1="206" y1="618" x2="234" y2="618" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="242" y="621" font-size="8" fill="#64748b">卡片交付路径</text>
  <line x1="356" y1="618" x2="384" y2="618" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr-cyan)"/>
  <text x="392" y="621" font-size="8" fill="#64748b">失败回落</text>
</svg>
