[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-fry-cards"
version = "0.7.3"
description = "🍟 hermes-fry-cards — 飞书流式卡片插件（Feishu/Lark CardKit v2.0 实时流式消息卡片）"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["Hermes", "Feishu", "Lark", "streaming-card", "potato"]
dependencies = [
  "lark-oapi>=1.4.0",
  "PyYAML>=6.0",
]

[project.scripts]
hermes-fry-cards = "hermes_fry_cards.__main__:main"

[project.entry-points."hermes_agent.plugins"]
hermes-fry-cards = "hermes_fry_cards"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "ruff>=0.8",
  "mypy>=1.11",
  "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["hermes_fry_cards*"]

[tool.setuptools.package-data]
"hermes_fry_cards" = ["assets/vendor-logos/*.png"]
"hermes_fry_cards.studio" = ["web/*.html", "web/css/*.css", "web/js/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["tests/samples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF002", "RUF003", "RUF006"]

# 面向用户的中文文案（错误提示、prompt、卡片标签）与断言这些文案的测试里的全角标点
# 不是「混淆字符」风险：它们本来就是给人读的中文，与仓内既有文案口径一致
# （RUF002/RUF003 早已对 docstring/注释放行）。按文件放行，不动全局规则。
[tool.ruff.lint.per-file-ignores]
"hermes_fry_cards/llm.py" = ["RUF001"]
"hermes_fry_cards/streaming/summary.py" = ["RUF001"]
"hermes_fry_cards/studio/tools.py" = ["RUF001"]
"tests/test_llm.py" = ["RUF001"]
"tests/test_ai_summary.py" = ["RUF001"]
"tests/test_studio_tools.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "lark_oapi.*"
ignore_missing_imports = true
